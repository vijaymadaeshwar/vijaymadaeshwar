name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: 'dist'
      - name: Collect generated SVGs
        continue-on-error: true
        run: |
          mkdir -p "${{ github.workspace }}/snake-out"
          find "${{ github.workspace }}" -name '*.svg' -type f -exec cp {} "${{ github.workspace }}/snake-out/" \; 2>/dev/null || true
          for f in "${{ steps.snake-gif.outputs.svg }}" "${{ steps.snake-gif.outputs.dark_svg }}"; do
            if [ -n "$f" ] && [ -f "$f" ]; then cp "$f" "${{ github.workspace }}/snake-out/"; fi
          done
          echo "--- collected ---"; ls -la "${{ github.workspace }}/snake-out" || true
      - name: Commit snake to output branch
        continue-on-error: true
        run: |
          cd "${{ github.workspace }}/snake-out"
          if [ -z "$(ls -A . 2>/dev/null)" ]; then
            echo "no SVG generated - keeping the existing rendered assets on the output branch"
            exit 0
          fi
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: update contribution snake" || echo "nothing to commit"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/${{ github.repository }}.git" HEAD:output || echo "push skipped"
